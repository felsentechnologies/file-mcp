name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go for the pinned scanner
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: false
      - name: Install Gitleaks
        run: GOBIN="$RUNNER_TEMP/security-bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history and public source files
        run: PATH="$RUNNER_TEMP/security-bin:$PATH" bash tests/check_secrets.sh

  verify-macos:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      MCP_HTTP_FUZZ_ITERATIONS: "40"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify vendored tunnel-client
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat vendor/tunnel-client/VERSION)" = "0.0.12"
          test "$(shasum -a 256 vendor/tunnel-client/darwin-arm64/tunnel-client | awk '{print $1}')" = "b1757220cf4722cec9085ee4a908cf0ee4c1a499a33bd99979b9a9c7669e29b1"
          vendor/tunnel-client/darwin-arm64/tunnel-client --version | grep -q '^0.0.12+881c9a8fed7cccbe6607cd419863bbca506b8215 '
          test -s vendor/tunnel-client/NOTICE
          test -s vendor/tunnel-client/darwin-arm64/THIRD-PARTY-LICENSES.txt

      - name: Verify vendored ripgrep
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat vendor/ripgrep/VERSION)" = "15.2.0"
          test "$(shasum -a 256 vendor/ripgrep/darwin-arm64/rg | awk '{print $1}')" = "a326a1fb48074202e9ad41e4cd1e389eeea372c8c6f7d7e80da81176d5d9430e"
          vendor/ripgrep/darwin-arm64/rg --version | grep -q '^ripgrep 15.2.0 '
          test -s vendor/ripgrep/COPYING
          test -s vendor/ripgrep/LICENSE-MIT
          test -s vendor/ripgrep/UNLICENSE

      - name: Static verification
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build_macos_app.sh build_macos_icon.sh build_brand_assets.sh create_source_archive.sh run_macos_dev.sh tests/test_swift_runtime.sh tests/test_swift_ui.sh tests/check_secrets.sh
          plutil -lint macos/Info.plist
          swiftc -warnings-as-errors -typecheck \
            -framework AppKit \
            -framework Network \
            -framework Security \
            macos/ProcessRunner.swift \
            macos/Ripgrep.swift \
            macos/LocalMCPServer.swift \
            macos/CodexHistory.swift \
            macos/LocalMCPRuntime.swift \
            macos/FileMCPApp.swift \
            macos/main.swift

      - name: Integration tests
        run: MCP_EXTENDED_SEARCH_TESTS=1 ./tests/test_swift_runtime.sh

      - name: UI state regression tests
        run: bash tests/test_swift_ui.sh

      - name: Coding tool regression tests
        run: bash tests/test_swift_agent_tools.sh

      - name: Build app
        run: ./build_macos_app.sh

      - name: Verify bundled legal resources
        shell: bash
        run: |
          set -Eeuo pipefail
          cmp LICENSE dist/FileMCP.app/Contents/Resources/FileMCP-LICENSE.txt
          cmp vendor/tunnel-client/LICENSE dist/FileMCP.app/Contents/Resources/tunnel-client-LICENSE.txt
          cmp vendor/tunnel-client/NOTICE dist/FileMCP.app/Contents/Resources/tunnel-client-NOTICE.txt
          cmp vendor/tunnel-client/darwin-arm64/THIRD-PARTY-LICENSES.txt dist/FileMCP.app/Contents/Resources/tunnel-client-THIRD-PARTY-LICENSES.txt
          cmp vendor/ripgrep/darwin-arm64/rg dist/FileMCP.app/Contents/MacOS/rg
          cmp vendor/ripgrep/COPYING dist/FileMCP.app/Contents/Resources/ripgrep-COPYING.txt
          cmp vendor/ripgrep/LICENSE-MIT dist/FileMCP.app/Contents/Resources/ripgrep-LICENSE-MIT.txt
          cmp vendor/ripgrep/UNLICENSE dist/FileMCP.app/Contents/Resources/ripgrep-UNLICENSE.txt
          cmp assets/branding/filemcp-v2/app-icon-128.png dist/FileMCP.app/Contents/Resources/FileMCP-login.png
          test -s dist/FileMCP.app/Contents/Resources/AppIcon.icns

  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      MCP_HTTP_FUZZ_ITERATIONS: "40"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Verify vendored tunnel-client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((Get-Content vendor/tunnel-client/VERSION -Raw).Trim() -ne "0.0.12") { throw "Unexpected tunnel-client version." }
          if ((Get-FileHash vendor/tunnel-client/windows-amd64/tunnel-client.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne "6649169733686805ca16cccd91774594d0c017fd729c37ad4ce1cd18323d9ae8") { throw "windows-amd64 tunnel-client checksum mismatch." }
          if ((Get-FileHash vendor/tunnel-client/windows-arm64/tunnel-client.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne "480684ec1031fc2985c7e87f9d669e7dfda4012a8ecdab21eabe1b5deafdd656") { throw "windows-arm64 tunnel-client checksum mismatch." }
          $version = & vendor/tunnel-client/windows-amd64/tunnel-client.exe --version
          if ($version -notmatch '^0\.0\.12\+881c9a8fed7cccbe6607cd419863bbca506b8215 ') { throw "Unexpected tunnel-client version output: $version" }
          if (-not (Test-Path vendor/tunnel-client/NOTICE -PathType Leaf)) { throw "Missing NOTICE." }
          if (-not (Test-Path vendor/tunnel-client/windows-amd64/THIRD-PARTY-LICENSES.txt -PathType Leaf)) { throw "Missing windows-amd64 license sidecar." }
          if (-not (Test-Path vendor/tunnel-client/windows-arm64/THIRD-PARTY-LICENSES.txt -PathType Leaf)) { throw "Missing windows-arm64 license sidecar." }

      - name: Verify vendored ripgrep
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((Get-Content vendor/ripgrep/VERSION -Raw).Trim() -ne "15.2.0") { throw "Unexpected ripgrep version." }
          if ((Get-FileHash vendor/ripgrep/windows-amd64/rg.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne "14231169855ec5205cf5a1b6f1db358ff4aed4247c86b69ce8aae647c77f6680") { throw "windows-amd64 ripgrep checksum mismatch." }
          if ((Get-FileHash vendor/ripgrep/windows-arm64/rg.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne "d33a29a9ef03c9f4c03be9e8d88498e6e2d2e566d64cdbdef97f9afc8f13120c") { throw "windows-arm64 ripgrep checksum mismatch." }
          $version = & vendor/ripgrep/windows-amd64/rg.exe --version | Select-Object -First 1
          if ($version -notmatch '^ripgrep 15\.2\.0 ') { throw "Unexpected ripgrep version output: $version" }
          foreach ($file in @("COPYING", "LICENSE-MIT", "UNLICENSE")) {
            if (-not (Test-Path "vendor/ripgrep/$file" -PathType Leaf)) { throw "Missing ripgrep $file." }
          }

      - name: Build Windows solution
        shell: pwsh
        run: dotnet build windows/FileMCP.Windows.sln -c Release -warnaserror

      - name: Windows integration tests
        shell: pwsh
        run: ./tests/test_windows_runtime.ps1

      - name: Build Windows x64 release
        shell: pwsh
        run: ./build_windows_app.ps1 -Architecture x64

      - name: Build Windows arm64 release
        shell: pwsh
        run: ./build_windows_app.ps1 -Architecture arm64

      - name: Windows app smoke test
        shell: pwsh
        run: ./tests/test_windows_app.ps1

      - name: Verify Windows release resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-SameFile([string]$Expected, [string]$Actual) {
            if ((Get-FileHash $Expected -Algorithm SHA256).Hash -ne (Get-FileHash $Actual -Algorithm SHA256).Hash) {
              throw "Release file mismatch: $Expected vs $Actual"
            }
          }
          Assert-SameFile assets/branding/filemcp-v2/FileMCP.ico windows/assets/filemcp.ico
          foreach ($arch in @("x64", "arm64")) {
            $root = "dist/windows-$arch/FileMCP"
            if (-not (Test-Path "$root/FileMCP.exe" -PathType Leaf)) { throw "Missing FileMCP.exe for $arch." }
            if (-not (Test-Path "$root/tunnel-client.exe" -PathType Leaf)) { throw "Missing tunnel-client.exe for $arch." }
            if (-not (Test-Path "$root/rg.exe" -PathType Leaf)) { throw "Missing rg.exe for $arch." }
            Assert-SameFile LICENSE "$root/FileMCP-LICENSE.txt"
            Assert-SameFile vendor/tunnel-client/LICENSE "$root/tunnel-client-LICENSE.txt"
            Assert-SameFile vendor/tunnel-client/NOTICE "$root/tunnel-client-NOTICE.txt"
            $vendorTag = if ($arch -eq "arm64") { "windows-arm64" } else { "windows-amd64" }
            Assert-SameFile "vendor/tunnel-client/$vendorTag/THIRD-PARTY-LICENSES.txt" "$root/tunnel-client-THIRD-PARTY-LICENSES.txt"
            Assert-SameFile "vendor/ripgrep/$vendorTag/rg.exe" "$root/rg.exe"
            Assert-SameFile vendor/ripgrep/COPYING "$root/ripgrep-COPYING.txt"
            Assert-SameFile vendor/ripgrep/LICENSE-MIT "$root/ripgrep-LICENSE-MIT.txt"
            Assert-SameFile vendor/ripgrep/UNLICENSE "$root/ripgrep-UNLICENSE.txt"
          }

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: FileMCP-windows-x64
          path: dist/FileMCP-v0.4.0-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: FileMCP-windows-arm64
          path: dist/FileMCP-v0.4.0-windows-arm64.zip
          if-no-files-found: error

  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MCP_HTTP_FUZZ_ITERATIONS: "40"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      AVALONIA_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm xvfb dbus gnome-keyring libsecret-tools desktop-file-utils appstream \
            libfontconfig1 libx11-6 libice6 libsm6 libxcursor1 libxext6 libxfixes3 libxi6 libxrandr2

      - name: Read version
        run: echo "FILEMCP_VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' linux/src/FileMCP.Linux/FileMCP.Linux.csproj | head -n 1)" >> "$GITHUB_ENV"

      - name: Verify vendored tunnel-client
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat vendor/tunnel-client/VERSION)" = "0.0.12"
          echo "ee9d4a75bc0b42f36f345aa96231e0db1ab00488122f34ebc99d6db055b6603e  vendor/tunnel-client/linux-amd64/tunnel-client" | sha256sum -c -
          echo "0a48e6696de0df5951c013e40be81ce775e6644e209758c48795a0ecbda06406  vendor/tunnel-client/linux-arm64/tunnel-client" | sha256sum -c -
          echo "fbe3d5c7d3a6a14317915d4c058f97342c9a533654f533adcba3261acc821a33  vendor/tunnel-client/linux-amd64/THIRD-PARTY-LICENSES.txt" | sha256sum -c -
          echo "2504135d0ddc2965429044fe06ea93d72582c3694f83b02eebe6cbc515dc9aaa  vendor/tunnel-client/linux-arm64/THIRD-PARTY-LICENSES.txt" | sha256sum -c -
          vendor/tunnel-client/linux-amd64/tunnel-client --version | grep -q '^0.0.12+881c9a8fed7cccbe6607cd419863bbca506b8215 '
          test -s vendor/tunnel-client/NOTICE

      - name: Verify vendored ripgrep
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat vendor/ripgrep/VERSION)" = "15.2.0"
          echo "e62198eb19b136b88c330af83647b5a962cb99b6b1f066758568f12de1974849  vendor/ripgrep/linux-amd64/rg" | sha256sum -c -
          echo "c14cdb389f34e504d69e386cfc67d5c5d9a730a990de03ca6910b2a15e30386a  vendor/ripgrep/linux-arm64/rg" | sha256sum -c -
          vendor/ripgrep/linux-amd64/rg --version | grep -q '^ripgrep 15.2.0 '
          test -s vendor/ripgrep/COPYING && test -s vendor/ripgrep/LICENSE-MIT && test -s vendor/ripgrep/UNLICENSE

      - name: Static verification
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build_linux_app.sh run_linux_dev.sh tests/test_linux_runtime.sh tests/test_linux_app.sh
          desktop-file-validate linux/packaging/com.localfilesmcp.FileMCP.desktop
          appstreamcli validate --no-net linux/packaging/com.localfilesmcp.FileMCP.metainfo.xml

      - name: Build Linux solution
        run: dotnet build linux/FileMCP.Linux.sln -c Release -warnaserror

      - name: Linux integration tests (real Secret Service)
        run: |
          dbus-run-session -- bash -c 'printf "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && FILEMCP_TEST_SECRET_SERVICE=real ./tests/test_linux_runtime.sh'

      - name: Build Linux x64 packages
        run: ./build_linux_app.sh --arch x64 --formats tar,deb,rpm

      - name: Build Linux arm64 packages
        run: ./build_linux_app.sh --arch arm64 --formats tar,deb,rpm

      - name: Linux app smoke test
        run: |
          ./tests/test_linux_app.sh x64
          ./tests/test_linux_app.sh arm64

      - name: Verify Linux release resources
        shell: bash
        run: |
          set -Eeuo pipefail
          for pair in x64:linux-amd64 arm64:linux-arm64; do
            arch="${pair%%:*}"; tag="${pair##*:}"; root="dist/linux-$arch/FileMCP"
            cmp LICENSE "$root/FileMCP-LICENSE.txt"
            cmp vendor/tunnel-client/LICENSE "$root/tunnel-client-LICENSE.txt"
            cmp vendor/tunnel-client/NOTICE "$root/tunnel-client-NOTICE.txt"
            cmp "vendor/tunnel-client/$tag/THIRD-PARTY-LICENSES.txt" "$root/tunnel-client-THIRD-PARTY-LICENSES.txt"
            cmp "vendor/tunnel-client/$tag/tunnel-client" "$root/tunnel-client"
            cmp "vendor/ripgrep/$tag/rg" "$root/rg"
            cmp vendor/ripgrep/COPYING "$root/ripgrep-COPYING.txt"
            cmp vendor/ripgrep/LICENSE-MIT "$root/ripgrep-LICENSE-MIT.txt"
            cmp vendor/ripgrep/UNLICENSE "$root/ripgrep-UNLICENSE.txt"
          done
          dpkg-deb --info "dist/filemcp_${FILEMCP_VERSION}_amd64.deb"
          rpm -qpi "dist/filemcp-${FILEMCP_VERSION}-1.x86_64.rpm"
          rpm -qp --requires "dist/filemcp-${FILEMCP_VERSION}-1.aarch64.rpm"

      - name: Install .deb on the runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends "./dist/filemcp_${FILEMCP_VERSION}_amd64.deb"
          filemcp --version | grep -qx "FileMCP ${FILEMCP_VERSION} (linux-x64)"
          test -x /usr/lib/filemcp/tunnel-client && test -x /usr/lib/filemcp/rg
          test -f /usr/share/applications/com.localfilesmcp.FileMCP.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/filemcp.png
          sudo apt-get remove -y filemcp
          test ! -e /usr/bin/filemcp

      - name: Set up QEMU for arm64 package checks
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install packages on other distributions
        shell: bash
        run: |
          set -Eeuo pipefail
          check() {
            local platform="$1" image="$2" script="$3"
            echo "::group::$image ($platform)"
            docker run --rm --platform "$platform" -e DOTNET_EnableWriteXorExecute=0 -v "$PWD/dist:/dist:ro" "$image" bash -ec "$script"
            echo "::endgroup::"
          }
          for pair in amd64:x86_64:x64 arm64:aarch64:arm64; do
            IFS=: read -r deb rpm arch <<< "$pair"
            platform="linux/$deb"
            expect="FileMCP ${FILEMCP_VERSION} (linux-$arch)"
            apt_install="export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq --no-install-recommends /dist/filemcp_${FILEMCP_VERSION}_${deb}.deb >/dev/null && filemcp --version | grep -qx '$expect' && echo ok"
            check "$platform" debian:12 "$apt_install"
            check "$platform" ubuntu:22.04 "$apt_install"
            check "$platform" fedora:latest "dnf install -y -q /dist/filemcp-${FILEMCP_VERSION}-1.${rpm}.rpm >/dev/null && filemcp --version | grep -qx '$expect' && echo ok"
            check "$platform" opensuse/tumbleweed "zypper --non-interactive --quiet install --allow-unsigned-rpm /dist/filemcp-${FILEMCP_VERSION}-1.${rpm}.rpm >/dev/null && filemcp --version | grep -qx '$expect' && echo ok"
          done

      - name: Upload Linux x64 packages
        uses: actions/upload-artifact@v4
        with:
          name: FileMCP-linux-x64
          path: |
            dist/FileMCP-v${{ env.FILEMCP_VERSION }}-linux-x64.tar.gz
            dist/filemcp_${{ env.FILEMCP_VERSION }}_amd64.deb
            dist/filemcp-${{ env.FILEMCP_VERSION }}-1.x86_64.rpm
          if-no-files-found: error

      - name: Upload Linux arm64 packages
        uses: actions/upload-artifact@v4
        with:
          name: FileMCP-linux-arm64
          path: |
            dist/FileMCP-v${{ env.FILEMCP_VERSION }}-linux-arm64.tar.gz
            dist/filemcp_${{ env.FILEMCP_VERSION }}_arm64.deb
            dist/filemcp-${{ env.FILEMCP_VERSION }}-1.aarch64.rpm
          if-no-files-found: error
